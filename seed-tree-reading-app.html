<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영어2 천재 3과 본문 읽기</title>
<style>
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:#fffdf7;color:#222}
body.dk{background:#161a17;color:#e6e6e0}
#top{position:sticky;top:0;background:#3b8f3b;padding:8px;z-index:5}
#tabs{display:flex;gap:6px;overflow-x:auto}
button{font:15px sans-serif;border:0;border-radius:8px;padding:8px 12px;background:#e4f2e0;cursor:pointer;white-space:nowrap}
#tabs button.on{background:#fff;font-weight:700;color:#1d6a1d}
#tl{display:flex;gap:6px;margin-top:6px}
#w{max-width:640px;margin:auto;padding:14px 18px 40px}
h2{font:700 17px sans-serif;color:#3b8f3b}
#t p{line-height:1.95;margin:8px 0}
.s{cursor:pointer;border-radius:4px}.s.h{background:#ffe98a;color:#222}
#nv{display:flex;gap:8px;margin-top:20px}#nv button{flex:1;padding:12px}
</style></head><body>
<div id=top><div id=tabs></div><div id=tl><button id=pl>🔊 듣기</button><button id=m>A−</button><button id=p>A+</button><button id=d>🌙</button></div></div>
<div id=w><div id=t></div><div id=nv><button id=pv>← 이전</button><button id=nx>다음 →</button></div></div>
<script>
const P=[["Plants are amazing.","Throughout their long existence, they have created diverse survival strategies.","Seeds, in particular, are one of the strongest survival techniques they have developed.","Let's discover the fascinating and mysterious world of seeds."],["Plants will do anything to spread their seeds.","They offer tasty food to animals in return for distributing their seeds.","Jackfruit, the world's largest tree fruit, has a sweet smell that attracts animals, similar to pineapples and bananas.","It tempts animals to eat delicious fruit meat, thereby getting them to eat the seeds.","The fruit meat is digested by the animals that consume it, but the seeds are not digested and pass through the animals' digestive tracts untouched.","When these animals poop out the seeds, the seeds begin to sprout and grow, and jackfruit spreads.","In exchange for a satisfying meal, the animals spread the jackfruit seeds."],["Many plants opt to scatter their seeds by providing food to animals, but not all of them do.","Some plants attach their seeds to passing animals, spreading them without any return benefit.","Instead of tempting sweet fruits, these seeds are equipped with sharp hooks or needles.","Devil's claw stands out as the most vicious of these plants.","Devil's claw primarily inhabits the Kalahari Desert in South Africa, Namibia, and Botswana.","Its blossoms resembling pink trumpets eventually transform into fruits with many hooks.","As these fruits dry, they become solid, and their hooks become tough enough to attach to the bodies of animals.","As animals pass by, the hooks extending in all directions will keep the dried fruit firmly attached to their fur.","As the animals move away, the seeds from the fruit will be scattered in various locations.","The attached hooks cause severe pain to the animals, making them feel like the devil is scratching them with its horrifying claws.","That is how devil's claw became known as the worst free rider."],["Out of numerous creative methods for spreading seeds, silver arrow-reed in South Africa has a particularly unique one.","Silver arrow-reed spreads its seeds by deceiving dung beetles.","Dung beetles, by nature, roll antelope dung and bury it in the ground to eat or lay eggs in.","Silver arrow-reed seeds are dark brown, round, and slightly larger than 1 cm in size.","Their visual appearance and smell are quite similar to antelope dung.","So when a seed falls onto the ground, dung beetles will approach the fallen seed within minutes.","Then, they carefully roll the seed away as if it were antelope dung.","That is why dung beetles are spotted rolling silver arrow-reed seeds that look and smell like dung balls.","When they try to eat the seeds or lay eggs inside of them, however, the confused beetles will realize they cannot.","They have no choice but to abort and search for real dung balls.","By tricking dung beetles to roll away and bury the seeds, silver arrow-reed is able to spread and plant its seeds better."],["Not all seeds are transported by animals.","Some are carried by the wind.","This approach is used by maple trees.","Maple seeds are shaped like a boomerang with irregular ridges on the surface.","When a maple seed falls from the tree, it spins around.","This rotation makes the seed stay in the air longer and fly farther.","It is similar to how helicopters get lifted and stay in the air using their propellers.","The rotation caused by its wings allows the maple seed to elevate twice as high as non-rotating seeds.","As a result, it can travel much farther from the parent tree.","The rotation also slows down the speed of the fall, and the seed softly lands on the ground.","This helps reduce the damage to the seed during the fall."],["In most cases, mature seeds are automatically separated from the parent plant.","However, some plants only release their seeds after enduring an extreme experience.","Eucalyptus is one such example.","Eucalyptus seeds are as tiny as grains of sand, but they are bound together in firm capsules.","Birds cannot eat them because they are securely protected by a strong shell.","In long periods of hot and dry weather, eucalyptus leaves rub together and naturally catch fire because the leaves contain highly flammable oil.","The extreme heat from the fire causes the shell to crack open.","Finally, the seeds come out of the shell, hit the ground, and begin to grow.","The fallen seeds are conveniently concealed in the soft ash left over after the fire, which protects them from the harsh environment.","Wildfire, often started by the parent tree, also burns practically everything on the ground, destroying other plants that would compete with the seeds for the water and sunlight needed for growth.","As you can see, eucalyptus is only able to reproduce provided that there is fire.","Where would you find the tallest tree in the world?","You will have to visit Redwood National Park in the United States to find it."],["Redwoods are known as the tallest plants in the world.","Typically, redwoods grow over 60 m, and it is easy to find them exceeding 90 m.","Among them, a redwood named Hyperion stands enormously tall, reaching over 115 m.","It holds the record as the world's tallest tree.","Before it was discovered, Helios, which was 114 m, was considered to be the tallest tree.","However, in 2006, two naturalists found a tree taller than Helios.","They were overwhelmed by its height that they named it after one of the Titans from Greek myths, Hyperion.","Hyperion was the name of the Titan of the Sun, meaning the highest one.","However, the odds of you seeing Hyperion at the park are slim to none.","The park keeps its precise location a secret to protect it from potential harm caused by visitors.","You may assume you can find it among the redwoods, but it is harder than you think.","The height difference between Hyperion and its neighboring redwoods is merely a few meters, making it nearly impossible to identify from the ground.","Every redwood in the park will look like a giant from the bottom."]];
const $=id=>document.getElementById(id);let n=0,fs=21,dk=0,sp=0;
try{const o=JSON.parse(localStorage.getItem('rd3')||'{}');n=o.n||0;fs=o.f||21;dk=o.d||0}catch(e){}
function sv(){try{localStorage.setItem('rd3',JSON.stringify({n,f:fs,d:dk}))}catch(e){}}
function stop(){try{speechSynthesis.cancel()}catch(e){}sp=0;$('pl').textContent='🔊 듣기'}
function draw(){stop();$('tabs').innerHTML=P.map((_,i)=>`<button class="${i==n?'on':''}" data-n=${i}>${i+1}번</button>`).join('');
$('t').innerHTML=`<h2>3과 ${n+1}번</h2><p>`+P[n].map((s,i)=>`<span class=s>${s}</span>`).join(' ')+'</p>';
$('t').style.fontSize=fs+'px';document.body.className=dk?'dk':'';sv();window.scrollTo(0,0)}
function play(){if(sp){stop();return}try{const u=new SpeechSynthesisUtterance(P[n].join(' '));u.lang='en-US';u.rate=.85;u.onend=stop;sp=1;$('pl').textContent='⏹ 정지';speechSynthesis.speak(u)}catch(e){stop();alert('이 기기에서는 읽어주기를 지원하지 않아요')}}
document.onclick=e=>{const t=e.target;
if(t.dataset&&t.dataset.n!==undefined){n=+t.dataset.n;draw()}
else if(t.classList.contains('s'))t.classList.toggle('h');
else if(t.id=='pl')play();
else if(t.id=='m'){fs=Math.max(14,fs-2);draw()}else if(t.id=='p'){fs=Math.min(40,fs+2);draw()}
else if(t.id=='d'){dk=1-dk;draw()}
else if(t.id=='pv'&&n>0){n--;draw()}else if(t.id=='nx'&&n<P.length-1){n++;draw()}};
draw();
</script></body></html>

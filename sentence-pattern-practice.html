<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>기초 문장 구조 연습</title>
<style>
  :root{
    --bg:#F5F8FB;
    --card:#FFFFFF;
    --ink:#1F2A37;
    --sub:#5B6B7A;
    --primary:#2E7DB8;
    --primary-dark:#1F5D8C;
    --accent:#F2994A;
    --good:#2E9E6C;
    --good-bg:#E7F7EF;
    --bad:#D9534F;
    --bad-bg:#FDECEC;
    --line:#E3EAF0;
    --tile:#EAF3FA;
    --tile-border:#BFDCEF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Trebuchet MS','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
    color:#fff;
    padding:22px 16px 18px;
    text-align:center;
  }
  header h1{
    margin:0 0 4px;
    font-size:1.35rem;
    letter-spacing:-0.3px;
  }
  header p{
    margin:0;
    font-size:0.85rem;
    opacity:0.9;
  }
  .tabs{
    display:flex;
    overflow-x:auto;
    gap:8px;
    padding:12px 12px 10px;
    background:var(--card);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:20;
  }
  .tab-btn{
    flex:0 0 auto;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--sub);
    padding:9px 14px;
    border-radius:999px;
    font-size:0.82rem;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:14px 12px 60px;
  }
  .unit-head{
    background:var(--card);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
    border:1px solid var(--line);
  }
  .unit-head .pattern{
    display:inline-block;
    background:#EAF3FA;
    color:var(--primary-dark);
    font-weight:bold;
    font-size:0.82rem;
    padding:5px 10px;
    border-radius:8px;
    margin-bottom:8px;
  }
  .unit-head h2{
    margin:0 0 4px;
    font-size:1.08rem;
  }
  .unit-head .desc{
    color:var(--sub);
    font-size:0.85rem;
    line-height:1.5;
  }
  .progress-bar{
    height:8px;
    border-radius:6px;
    background:var(--line);
    overflow:hidden;
    margin-top:10px;
  }
  .progress-fill{
    height:100%;
    background:var(--good);
    width:0%;
    transition:width .3s;
  }
  .progress-label{
    font-size:0.78rem;
    color:var(--sub);
    margin-top:6px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px 16px;
    margin-bottom:12px;
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .no-badge{
    flex:0 0 auto;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    font-size:0.78rem;
    font-weight:bold;
    display:flex;align-items:center;justify-content:center;
  }
  .ko{
    flex:1;
    font-size:0.97rem;
    color:var(--ink);
    padding-top:2px;
  }
  .row-btns{
    display:flex;
    gap:6px;
    flex:0 0 auto;
  }
  .icon-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:8px;
    padding:6px 9px;
    font-size:0.85rem;
    cursor:pointer;
    color:var(--sub);
  }
  .icon-btn.on{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
  .answer-box{
    display:none;
    margin-top:10px;
    background:#F7FBFD;
    border:1px dashed var(--tile-border);
    border-radius:10px;
    padding:10px 12px;
    font-size:1.05rem;
    font-weight:bold;
    color:var(--primary-dark);
  }
  .answer-box.show{display:block;}
  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:12px 0;
  }
  .unscramble-label{
    font-size:0.78rem;
    color:var(--sub);
    font-weight:bold;
    margin-bottom:8px;
  }
  .slot-area{
    min-height:44px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#FAFCFE;
    padding:8px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
  }
  .slot-area.empty::before{
    content:"위 단어 조각을 순서대로 눌러 문장을 완성하세요";
    color:#A9B7C4;
    font-size:0.8rem;
    padding:4px 2px;
  }
  .pool-area{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
  }
  .word-tile{
    background:var(--tile);
    border:1.5px solid var(--tile-border);
    color:var(--primary-dark);
    font-weight:bold;
    font-size:0.9rem;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
    user-select:none;
  }
  .word-tile:active{transform:scale(0.96);}
  .slot-tile{
    background:#fff;
    border:1.5px solid var(--primary);
    color:var(--primary-dark);
    font-weight:bold;
    font-size:0.9rem;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .uns-btns{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .btn{
    border:none;
    border-radius:9px;
    padding:9px 14px;
    font-size:0.85rem;
    font-weight:bold;
    cursor:pointer;
  }
  .btn-check{background:var(--primary);color:#fff;}
  .btn-reset{background:#fff;border:1.5px solid var(--line);color:var(--sub);}
  .feedback{
    margin-top:9px;
    font-size:0.86rem;
    font-weight:bold;
    padding:8px 10px;
    border-radius:8px;
    display:none;
  }
  .feedback.good{display:block;background:var(--good-bg);color:var(--good);}
  .feedback.bad{display:block;background:var(--bad-bg);color:var(--bad);}
  footer{
    text-align:center;
    color:var(--sub);
    font-size:0.75rem;
    padding:10px 0 30px;
  }
</style>
</head>
<body>

<header>
  <h1>📘 기초 문장 구조 연습</h1>
  <p>뜻을 보고 문장을 확인한 뒤, 단어 조각으로 직접 문장을 만들어보세요</p>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div class="unit-head">
    <div class="pattern" id="unitPattern"></div>
    <h2 id="unitTitle"></h2>
    <div class="desc" id="unitDesc"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">문장 배열 완료: 0 / 10</div>
  </div>
  <div id="cardList"></div>
</main>

<footer>같이 소리 내어 읽고, 뜻 → 문장 → 배열 순서로 연습해보세요 🙂</footer>

<script>
const UNITS = [
  {
    title: "be동사 기본 문장",
    pattern: "주어 + be동사(am/is/are) + 보어",
    desc: "‘~이다, ~하다’라는 뜻의 be동사 문장이에요. 주어에 따라 am/is/are가 달라지는 것을 확인하세요.",
    sentences: [
      ["I am a student.", "나는 학생이다."],
      ["You are tall.", "너는 키가 크다."],
      ["He is my friend.", "그는 나의 친구이다."],
      ["She is happy.", "그녀는 행복하다."],
      ["It is a cat.", "그것은 고양이다."],
      ["They are teachers.", "그들은 선생님들이다."],
      ["We are hungry.", "우리는 배고프다."],
      ["This is my bag.", "이것은 나의 가방이다."],
      ["That is a big tree.", "저것은 큰 나무이다."],
      ["I am ten years old.", "나는 열 살이다."]
    ]
  },
  {
    title: "be동사 부정문 / 의문문",
    pattern: "주어 + be동사 + not / Be동사 + 주어 ~?",
    desc: "be동사 뒤에 not을 붙이면 부정문, be동사를 문장 맨 앞으로 보내면 의문문이 돼요.",
    sentences: [
      ["I am not tired.", "나는 피곤하지 않다."],
      ["You are not late.", "너는 늦지 않았다."],
      ["He is not busy.", "그는 바쁘지 않다."],
      ["She is not at home.", "그녀는 집에 없다."],
      ["They are not ready.", "그들은 준비되지 않았다."],
      ["Is she your sister?", "그녀는 너의 여동생이니?"],
      ["Are you okay?", "너 괜찮니?"],
      ["Is he a doctor?", "그는 의사이니?"],
      ["Are they your friends?", "그들은 너의 친구들이니?"],
      ["Is it cold today?", "오늘 춥니?"]
    ]
  },
  {
    title: "일반동사 현재형 (평서문)",
    pattern: "주어 + 일반동사 + 목적어",
    desc: "‘~한다’라는 뜻의 일반동사 문장이에요. 주어가 He/She/It이면 동사에 -s가 붙는 것을 확인하세요.",
    sentences: [
      ["I like pizza.", "나는 피자를 좋아한다."],
      ["She likes music.", "그녀는 음악을 좋아한다."],
      ["We eat lunch.", "우리는 점심을 먹는다."],
      ["He plays soccer.", "그는 축구를 한다."],
      ["They watch TV.", "그들은 TV를 본다."],
      ["I drink water.", "나는 물을 마신다."],
      ["She reads books.", "그녀는 책을 읽는다."],
      ["We study English.", "우리는 영어를 공부한다."],
      ["He drives a car.", "그는 차를 운전한다."],
      ["They live in Seoul.", "그들은 서울에 산다."]
    ]
  },
  {
    title: "일반동사 부정문 / 의문문",
    pattern: "주어 + don't/doesn't + 동사원형 / Do/Does + 주어 + 동사원형 ~?",
    desc: "일반동사 부정문·의문문에는 do/does가 필요해요. 이때 뒤에 오는 동사는 원래 모양(원형)으로 돌아가요.",
    sentences: [
      ["I don't like coffee.", "나는 커피를 좋아하지 않는다."],
      ["She doesn't play the piano.", "그녀는 피아노를 치지 않는다."],
      ["We don't eat meat.", "우리는 고기를 먹지 않는다."],
      ["He doesn't like rain.", "그는 비를 좋아하지 않는다."],
      ["They don't watch TV.", "그들은 TV를 보지 않는다."],
      ["Do you have a pen?", "너는 펜을 가지고 있니?"],
      ["Does he live here?", "그는 여기 사니?"],
      ["Do they like music?", "그들은 음악을 좋아하니?"],
      ["Does she speak English?", "그녀는 영어를 말하니?"],
      ["Do you know him?", "너는 그를 아니?"]
    ]
  },
  {
    title: "There is / There are",
    pattern: "There is + 단수명사 / There are + 복수명사",
    desc: "‘~이 있다’라는 뜻이에요. 뒤에 오는 명사가 하나면 is, 여러 개면 are를 써요.",
    sentences: [
      ["There is a book on the desk.", "책상 위에 책이 있다."],
      ["There are two dogs in the yard.", "마당에 개가 두 마리 있다."],
      ["There is a pen in my bag.", "내 가방 안에 펜이 있다."],
      ["There are many students in the class.", "교실에 많은 학생들이 있다."],
      ["There is a cat under the table.", "테이블 아래에 고양이가 있다."],
      ["There is a park near my house.", "우리 집 근처에 공원이 있다."],
      ["There are three windows in the room.", "방에 창문이 세 개 있다."],
      ["There is water in the bottle.", "병 안에 물이 있다."],
      ["There are flowers in the garden.", "정원에 꽃들이 있다."],
      ["There is a phone on the table.", "테이블 위에 전화기가 있다."]
    ]
  },
  {
    title: "전치사구로 위치 표현하기",
    pattern: "주어 + be동사 + 전치사(on/in/at/under...) + 장소",
    desc: "on(위에), in(안에), at(~에), under(아래에) 같은 전치사로 위치를 나타내요.",
    sentences: [
      ["The cat is on the table.", "고양이는 테이블 위에 있다."],
      ["My book is in the bag.", "내 책은 가방 안에 있다."],
      ["She is at school.", "그녀는 학교에 있다."],
      ["He is under the tree.", "그는 나무 아래에 있다."],
      ["The ball is behind the door.", "공은 문 뒤에 있다."],
      ["They are in the room.", "그들은 방 안에 있다."],
      ["The car is in front of the house.", "차는 집 앞에 있다."],
      ["My phone is next to the computer.", "내 전화기는 컴퓨터 옆에 있다."],
      ["We are at the park.", "우리는 공원에 있다."],
      ["The dog is near the door.", "개는 문 근처에 있다."]
    ]
  },
  {
    title: "조동사 can",
    pattern: "주어 + can + 동사원형 / Can + 주어 + 동사원형 ~?",
    desc: "‘~할 수 있다’라는 뜻이에요. can 뒤에는 항상 동사원형이 와요.",
    sentences: [
      ["I can swim.", "나는 수영할 수 있다."],
      ["You can sing well.", "너는 노래를 잘 부를 수 있다."],
      ["He can run fast.", "그는 빨리 달릴 수 있다."],
      ["She can cook well.", "그녀는 요리를 잘 할 수 있다."],
      ["We can speak English.", "우리는 영어를 말할 수 있다."],
      ["Can you speak English?", "너는 영어를 말할 수 있니?"],
      ["He can't drive.", "그는 운전을 할 수 없다."],
      ["I can't dance.", "나는 춤을 출 수 없다."],
      ["Can she play the guitar?", "그녀는 기타를 칠 수 있니?"],
      ["They can help you.", "그들은 너를 도울 수 있다."]
    ]
  },
  {
    title: "형용사 / 감각동사 문장",
    pattern: "주어 + be동사 + 형용사 / 주어 + look·smell·taste·sound·feel + 형용사",
    desc: "look(보이다), smell(냄새가 나다), taste(맛이 나다), sound(들리다), feel(느끼다) 뒤에는 형용사가 와요.",
    sentences: [
      ["This is a big house.", "이것은 큰 집이다."],
      ["That is a small dog.", "저것은 작은 개이다."],
      ["The soup smells good.", "수프에서 좋은 냄새가 난다."],
      ["You look tired.", "너 피곤해 보인다."],
      ["She looks happy.", "그녀는 행복해 보인다."],
      ["This cake tastes sweet.", "이 케이크는 달콤한 맛이 난다."],
      ["The music sounds nice.", "그 음악은 좋게 들린다."],
      ["He feels sick.", "그는 아프다고 느낀다."],
      ["This bag is heavy.", "이 가방은 무겁다."],
      ["That flower is beautiful.", "저 꽃은 아름답다."]
    ]
  }
];

let currentUnit = 0;
const doneMap = {}; // "unitIdx-sentIdx" -> true

function tokenize(en){
  const endPunct = en.endsWith("?") ? "?" : ".";
  const stripped = en.replace(/[.?]$/,"");
  const words = stripped.split(" ");
  return {words, endPunct};
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  // ensure shuffled differs from original when possible
  if(a.join(" ")===arr.join(" ") && arr.length>1){
    [a[0],a[1]]=[a[1],a[0]];
  }
  return a;
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function buildTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = "";
  UNITS.forEach((u,idx)=>{
    const b = document.createElement('button');
    b.className = 'tab-btn' + (idx===currentUnit ? ' active' : '');
    b.textContent = (idx+1) + '. ' + u.title;
    b.onclick = ()=>{ currentUnit = idx; render(); };
    tabsEl.appendChild(b);
  });
}

function updateProgress(){
  const unit = UNITS[currentUnit];
  let count = 0;
  unit.sentences.forEach((s,i)=>{
    if(doneMap[currentUnit+'-'+i]) count++;
  });
  document.getElementById('progressFill').style.width = (count/unit.sentences.length*100)+'%';
  document.getElementById('progressLabel').textContent = '문장 배열 완료: ' + count + ' / ' + unit.sentences.length;
}

function render(){
  buildTabs();
  const unit = UNITS[currentUnit];
  document.getElementById('unitPattern').textContent = unit.pattern;
  document.getElementById('unitTitle').textContent = unit.title;
  document.getElementById('unitDesc').textContent = unit.desc;

  const list = document.getElementById('cardList');
  list.innerHTML = "";

  unit.sentences.forEach((pair, i)=>{
    const [en, ko] = pair;
    const {words, endPunct} = tokenize(en);

    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div class="card-top">
        <div class="no-badge">${i+1}</div>
        <div class="ko">${ko}</div>
        <div class="row-btns">
          <button class="icon-btn" data-act="toggle">정답 보기</button>
          <button class="icon-btn" data-act="speak">🔊</button>
        </div>
      </div>
      <div class="answer-box" data-role="answer">${en}</div>
      <hr class="divider">
      <div class="unscramble-label">✏️ 단어 조각을 순서대로 눌러 문장을 완성해보세요</div>
      <div class="slot-area empty" data-role="slot"></div>
      <div class="pool-area" data-role="pool"></div>
      <div class="uns-btns">
        <button class="btn btn-check" data-act="check">확인하기</button>
        <button class="btn btn-reset" data-act="shuffle">다시 섞기</button>
      </div>
      <div class="feedback" data-role="feedback"></div>
    `;

    const answerBox = card.querySelector('[data-role="answer"]');
    const toggleBtn = card.querySelector('[data-act="toggle"]');
    toggleBtn.onclick = ()=>{
      const showing = answerBox.classList.toggle('show');
      toggleBtn.textContent = showing ? '정답 숨기기' : '정답 보기';
    };

    card.querySelector('[data-act="speak"]').onclick = ()=> speak(en);

    const slotArea = card.querySelector('[data-role="slot"]');
    const poolArea = card.querySelector('[data-role="pool"]');
    const feedback = card.querySelector('[data-role="feedback"]');

    let currentOrder = [];

    function renderPool(poolWords){
      poolArea.innerHTML = "";
      poolWords.forEach((w, idx)=>{
        const tile = document.createElement('div');
        tile.className = 'word-tile';
        tile.textContent = w;
        tile.onclick = ()=>{
          currentOrder.push(w);
          poolWords.splice(idx,1);
          renderPool(poolWords);
          renderSlot();
        };
        poolArea.appendChild(tile);
      });
    }

    function renderSlot(){
      slotArea.innerHTML = "";
      if(currentOrder.length===0){
        slotArea.classList.add('empty');
      } else {
        slotArea.classList.remove('empty');
      }
      currentOrder.forEach((w, idx)=>{
        const tile = document.createElement('div');
        tile.className = 'slot-tile';
        tile.textContent = w;
        tile.onclick = ()=>{
          currentOrder.splice(idx,1);
          currentPool.push(w);
          renderPool(currentPool);
          renderSlot();
        };
        slotArea.appendChild(tile);
      });
      feedback.className = 'feedback';
      feedback.textContent = '';
    }

    let currentPool = shuffle(words);

    function resetRound(){
      currentOrder = [];
      currentPool = shuffle(words);
      renderPool(currentPool);
      renderSlot();
    }

    card.querySelector('[data-act="shuffle"]').onclick = resetRound;

    card.querySelector('[data-act="check"]').onclick = ()=>{
      if(currentOrder.length !== words.length){
        feedback.className = 'feedback bad';
        feedback.textContent = '모든 단어 조각을 사용해서 문장을 완성해보세요.';
        return;
      }
      const isCorrect = currentOrder.join(" ") === words.join(" ");
      if(isCorrect){
        feedback.className = 'feedback good';
        feedback.textContent = '정답이에요! 👏 ' + en;
        doneMap[currentUnit+'-'+i] = true;
        updateProgress();
      } else {
        feedback.className = 'feedback bad';
        feedback.textContent = '다시 확인해보세요. 어순이 맞는지 살펴보세요.';
      }
    };

    resetRound();
    list.appendChild(card);
  });

  updateProgress();
  window.scrollTo({top:0, behavior:'instant'});
}

render();
</script>

</body>
</html>
